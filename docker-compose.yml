services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      BITRIX_WEBHOOK_URL: ${BITRIX_WEBHOOK_URL}
      BITRIX_STORAGE_ID: ${BITRIX_STORAGE_ID:-1}
      SECRET_KEY: ${SECRET_KEY:-supersecretkey123}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin2025!}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./inspectors.db}
    volumes:
      - backend_data:/app/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend

volumes:
  backend_data:
